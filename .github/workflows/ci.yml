name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: '1.12'
      - uses: julia-actions/cache@v2

      # 1) Native kernels: answers, convergence orders, Float32/Float64.
      - name: Native tests
        run: julia --project=. -e 'using Pkg; Pkg.test()'

      # 2) The .wasm modules and manifests are committed in web/static/wasm so the site builds
      #    without Julia. Fail if they are stale: manifests and native expected values must equal
      #    what the current source generates, and (next step) the committed .wasm must reproduce
      #    those values.
      - name: Committed WASM artifacts are up to date
        # The check does not compile, so it never loads WasmTarget. Skip automatic
        # precompilation of the whole build environment (about 5 minutes).
        env:
          JULIA_PKG_PRECOMPILE_AUTO: '0'
        run: |
          julia --project=wasm -e 'using Pkg; Pkg.instantiate()'
          julia --project=wasm wasm/build.jl --check

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Committed WASM matches native
        run: node wasm/check_parity.mjs

      # 3) Web: type check, connector tests, then open the built site in Chrome.
      - uses: oven-sh/setup-bun@v2
      - name: Install web dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Type check
        working-directory: web
        run: bun run check
      - name: Connector tests
        working-directory: web
        run: bun run test
      - name: End-to-end tests
        working-directory: web
        run: bun run test:e2e

      # 4) The deployable static site, .wasm included. It is served from the root of
      #    https://grid-to-pinn.liam.kim, so the base path is empty.
      - name: Build site
        working-directory: web
        run: bun run build
        env:
          BASE_PATH: ''
      - name: Upload site for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: web/test-results/screenshots
          if-no-files-found: ignore

  # Publish to GitHub Pages (custom domain grid-to-pinn.liam.kim, set in the repository's
  # Pages settings). Runs only for main, and only after every check above passed.
  deploy:
    needs: build-and-verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
